[build-system]
requires = ["hatchling>=1.27"]   # SPDX `license` and `license-files`
build-backend = "hatchling.build"

[project]
name = "strata-python"
version = "0.2.0"        # the single source of truth: `strata_python.__version__` reads it back with importlib.metadata
description = "Common code for Python web server apps: OS helpers, settings, FastAPI serving, CLI commands, test fixtures and the strata-check gate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jburnhams" }]   # a handle, not an email: this is shown on PyPI
keywords = ["fastapi", "pytest", "settings", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pytest>=8",             # the plugin and fixtures ship with the library; apps have pytest anyway
    "tzdata; sys_platform == 'win32'",   # IANA timezone database, needed on Windows for zoneinfo
]

[project.urls]
Homepage = "https://github.com/jburnhams/strata-python"
Source = "https://github.com/jburnhams/strata-python"
Changelog = "https://github.com/jburnhams/strata-python/blob/main/CHANGELOG.md"

[project.scripts]
strata-check = "strata_python.check:main"
strata-public-check = "strata_python.public_check:main"

[project.entry-points.pytest11]
strata_python = "strata_python.pytest_plugin"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest-cov>=5",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-xdist",
    "ruff",
    "pyright",
    "ty",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strata_python"]

# Hatch puts every tracked file in the sdist by default (agent notes, CI, the lockfile); a PyPI upload is permanent,
# so the sdist carries only what builds and tests the package.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# The plugin is loaded by tests/conftest.py, not its entry point: pytest imports entry-point plugins before coverage starts, which would hide their lines from the report
addopts = "-ra --timeout=300 --strict-markers --strict-config -p pytester -p no:strata_python"
strata_env_prefix = "DEMO"
strata_tuning_vars = ["DEMO_TUNE"]
markers = ["integration: runs a real server or subprocess end-to-end (tests/integration)"]

[tool.coverage.run]
source = ["src/strata_python"]
branch = true

[tool.coverage.report]
skip_empty = true
# The Windows branches of oslib run only on the Windows CI leg, so they do not count towards the number measured elsewhere
exclude_also = ["if __name__ == .__main__.:", "if WIN:"]
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S", "TID"]
ignore = ["E501"]        # the formatter wraps code; long comments and docstrings stay (the house style comments the why)

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.importorskip".msg = "Do not skip when a dependency is missing: install it (locally and in CI) and let the test fail if it is not there. A deliberate skip is a marker with a reason, see AGENTS.md (Testing)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S104", "S105", "S106", "S108", "S603", "S607"]    # asserts, urlopen of our own loopback servers, fake secrets, tmp paths, subprocess of our own code

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
