[build-system]
requires = ["hatchling>=1.27"]   # SPDX `license` and `license-files`
build-backend = "hatchling.build"

[project]
name = "strata-python"
version = "0.2.0"        # the single source of truth: `strata_python.__version__` reads it back with importlib.metadata
description = "Common code for Python web server apps: OS helpers, settings, FastAPI serving, CLI commands, test fixtures and the strata-check gate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jburnhams" }]   # a handle, not an email: this is shown on PyPI
keywords = ["fastapi", "pytest", "settings", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Typing :: Typed",
]
dependencies = [
    # The stack every strata app shares. Minimum = what CI here tested; the cap is the next release that may break,
    # so apps get fixes through their own lock without waiting for this library, and a breaking release waits for it.
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "pytest>=8,<10",          # the plugin and fixtures ship with the library; apps have pytest anyway
    "tzdata; sys_platform == 'win32'",   # IANA timezone database, needed on Windows for zoneinfo
]

[project.optional-dependencies]
# The tools `strata-check` runs and the pytest plugins the apps use: an app's dev group is just `strata-python[dev]`,
# so every app runs the same checker versions and one bump here moves them all. ruff and ty are 0.x and change rules
# in minor releases, hence the tighter caps.
dev = [
    "httpx>=0.27,<1",         # FastAPI's TestClient
    "pyright>=1.1.400,<2",
    "pytest-cov>=5,<8",
    "pytest-randomly>=3,<6",
    "pytest-timeout>=2,<3",
    "pytest-xdist>=3,<4",
    "ruff>=0.17,<0.18",
    "ty>=0.0.99,<0.1",
]
# strata_python.db: SQLAlchemy models, Alembic migrations, the live-database guard and the SQLite/Postgres test
# fixtures. psycopg's binary wheel is included so an app on the shared Postgres needs nothing else; an app that only
# uses SQLite pays a wheel download, not a build.
db = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/jburnhams/strata-python"
Source = "https://github.com/jburnhams/strata-python"
Changelog = "https://github.com/jburnhams/strata-python/blob/main/CHANGELOG.md"

[project.scripts]
strata-check = "strata_python.check:main"
strata-public-check = "strata_python.public_check:main"
strata-db = "strata_python.db.cli:main"

[project.entry-points.pytest11]
strata_python = "strata_python.pytest_plugin"
strata_python_db = "strata_python.db.pytest_plugin"   # inert unless the db extra is installed

[dependency-groups]
dev = ["strata-python[dev,db]"]   # the same tools the apps get, and the db extra so its tests run

[tool.hatch.build.targets.wheel]
packages = ["src/strata_python"]

# Hatch puts every tracked file in the sdist by default (agent notes, CI, the lockfile); a PyPI upload is permanent,
# so the sdist carries only what builds and tests the package.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# The plugin is loaded by tests/conftest.py, not its entry point: pytest imports entry-point plugins before coverage starts, which would hide their lines from the report
addopts = "-ra --timeout=300 --strict-markers --strict-config -p pytester -p no:strata_python -p no:strata_python_db"
strata_env_prefix = "DEMO"
strata_tuning_vars = ["DEMO_TUNE"]
markers = ["integration: runs a real server or subprocess end-to-end (tests/integration)"]

[tool.coverage.run]
source = ["src/strata_python"]
omit = ["*/__main__.py"]   # two lines that call main(); tests/integration runs them as `python -m`
branch = true

[tool.coverage.report]
skip_empty = true
# The Windows branches of oslib run only on the Windows CI leg, so they do not count towards the number measured elsewhere
exclude_also = ["if __name__ == .__main__.:", "if WIN:"]
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S", "TID"]
ignore = ["E501"]        # the formatter wraps code; long comments and docstrings stay (the house style comments the why)

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.importorskip".msg = "Do not skip when a dependency is missing: install it (locally and in CI) and let the test fail if it is not there. A deliberate skip is a marker with a reason, see AGENTS.md (Testing)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S104", "S105", "S106", "S108", "S603", "S607", "S608"]    # asserts, urlopen of our own loopback servers, fake secrets, tmp paths, subprocess of our own code, SQL naming generated test schemas

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
