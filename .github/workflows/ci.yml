name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      STRATA_TEST_PG: ${{ matrix.os != 'macos-latest' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      # strata_python.db's Postgres tests start a private throwaway server from the PostgreSQL binaries. The Linux
      # and Windows images ship them (Windows sets PGBIN); STRATA_TEST_PG=1 makes a missing server fail those tests
      # instead of skipping them. macOS has none, so they skip there and say so.
      - name: PostgreSQL server binaries
        if: matrix.os == 'ubuntu-latest'
        run: ls /usr/lib/postgresql/*/bin/initdb || (sudo apt-get update && sudo apt-get install -y postgresql)
      - name: Lockfile, lint, format and types (once, on the newest Python)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run --locked strata-check --fast
      - name: Nothing personal or machine-specific in the tree or the build (STRATA_PUBLIC_DENY is a secret, so the owner's own names stay out of the repo)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        env:
          STRATA_PUBLIC_DENY: ${{ secrets.STRATA_PUBLIC_DENY }}
        run: uv build && uv run --locked strata-public-check . dist/*
      - name: Unit tests with coverage (the floor is gated on Linux; macOS and Windows run the other branches of oslib)
        run: uv run --locked pytest tests/unit --cov --cov-report=term ${{ matrix.os != 'ubuntu-latest' && '--cov-fail-under=0' || '' }}
      - name: Integration tests
        run: uv run --locked pytest tests/integration

  audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv audit --locked
